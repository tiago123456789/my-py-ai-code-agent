<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban ToDo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <form id="taskForm" class="task-form" autocomplete="off" onsubmit="return false;">
      <input type="text" id="taskTitle" placeholder="Enter task title" required />
      <button type="submit" id="saveBtn">Save</button>
    </form>

    <div class="board" id="board">
      <div class="column" data-status="todo" draggable="false">
        <div class="column-header">Todo</div>
        <div class="task-list" data-list="todo"></div>
      </div>
      <div class="column" data-status="in-progress" draggable="false">
        <div class="column-header">In Progress</div>
        <div class="task-list" data-list="in-progress"></div>
      </div>
      <div class="column" data-status="done" draggable="false">
        <div class="column-header">Done</div>
        <div class="task-list" data-list="done"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
